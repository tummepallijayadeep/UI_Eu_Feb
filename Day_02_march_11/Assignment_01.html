<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAthFunctions</title>
    <body>
        <h1>Sum of given Number is:</h1>
        <p id="answer"></p> 
    <script>
        window.alert('Hellooooo, Are you ready to do some Math Functions!!'); 
        let a = window.prompt('Please enter your First Number');
        let b = window.prompt('Please enter your Secound Number');
         
        a = number(a);
        b = number(b);

        let sum = a + b;

        alert ('The sum of'   + a +   'and'   + b +   'is:' +sum);

        document.getElementById("answer").innerText = 
            `The sum of ${a} and ${b} is: ${sum}`;
    </script>
    </body>
</head>
<body>
    <h4>please rate us from 1-10 for giving your answer</h4>
</body>
</html>
